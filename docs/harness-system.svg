<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-size: 12px; fill: #64748b; }
      .node-label { font-size: 13px; fill: #1e293b; font-weight: 600; }
      .node-sub { font-size: 11px; fill: #64748b; }
      .layer-label { font-size: 14px; fill: #475569; font-weight: 700; letter-spacing: 1px; }
      .legend-text { font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" class="title">Harness Engineering System</text>
  <text x="480" y="58" text-anchor="middle" class="subtitle">Mint AI Chat — Agent-First Architecture</text>

  <!-- Layer 1: Orientation Map (top) -->
  <rect x="40" y="80" width="880" height="100" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
  <text x="60" y="102" class="layer-label">LAYER 1: ORIENTATION MAP</text>

  <rect x="60" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="136" text-anchor="middle" class="node-label">AGENTS.md</text>
  <text x="140" y="152" text-anchor="middle" class="node-sub">Project guide</text>

  <rect x="240" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="136" text-anchor="middle" class="node-label">CLAUDE.md</text>
  <text x="320" y="152" text-anchor="middle" class="node-sub">Dev instructions</text>

  <rect x="420" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="136" text-anchor="middle" class="node-label">ARCHITECTURE.md</text>
  <text x="500" y="152" text-anchor="middle" class="node-sub">System overview</text>

  <rect x="600" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="136" text-anchor="middle" class="node-label">GitNexus</text>
  <text x="680" y="152" text-anchor="middle" class="node-sub">Code intelligence</text>

  <!-- Layer 2: System of Record -->
  <rect x="40" y="200" width="880" height="120" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <text x="60" y="222" class="layer-label">LAYER 2: SYSTEM OF RECORD</text>

  <rect x="60" y="232" width="140" height="76" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="256" text-anchor="middle" class="node-label">LAYERS.md</text>
  <text x="130" y="272" text-anchor="middle" class="node-sub">Layer hierarchy</text>
  <text x="130" y="286" text-anchor="middle" class="node-sub">+ Remediation</text>

  <rect x="220" y="232" width="140" height="76" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="256" text-anchor="middle" class="node-label">Golden Principles</text>
  <text x="290" y="272" text-anchor="middle" class="node-sub">IMPORTS, NAMING</text>
  <text x="290" y="286" text-anchor="middle" class="node-sub">ERRORS, TESTING</text>

  <rect x="380" y="232" width="140" height="76" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="256" text-anchor="middle" class="node-label">SECURITY.md</text>
  <text x="450" y="272" text-anchor="middle" class="node-sub">Threat model</text>
  <text x="450" y="286" text-anchor="middle" class="node-sub">Secrets mgmt</text>

  <rect x="540" y="232" width="140" height="76" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="256" text-anchor="middle" class="node-label">Exec Plans</text>
  <text x="610" y="272" text-anchor="middle" class="node-sub">docs/exec-plans/</text>
  <text x="610" y="286" text-anchor="middle" class="node-sub">Active + Completed</text>

  <rect x="700" y="232" width="140" height="76" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="256" text-anchor="middle" class="node-label">Design Docs</text>
  <text x="770" y="272" text-anchor="middle" class="node-sub">docs/design-docs/</text>
  <text x="770" y="286" text-anchor="middle" class="node-sub">ADRs + Decisions</text>

  <!-- Layer 3: Mechanical Enforcement -->
  <rect x="40" y="340" width="880" height="120" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="60" y="362" class="layer-label">LAYER 3: MECHANICAL ENFORCEMENT</text>

  <rect x="60" y="372" width="180" height="76" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="396" text-anchor="middle" class="node-label">Boundary Test</text>
  <text x="150" y="412" text-anchor="middle" class="node-sub">vitest + import scanner</text>
  <text x="150" y="426" text-anchor="middle" class="node-sub">KNOWN_VIOLATIONS ratchet</text>

  <rect x="260" y="372" width="180" height="76" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="396" text-anchor="middle" class="node-label">Linter Rules</text>
  <text x="350" y="412" text-anchor="middle" class="node-sub">no-restricted-imports</text>
  <text x="350" y="426" text-anchor="middle" class="node-sub">Remediation in errors</text>

  <rect x="460" y="372" width="180" height="76" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="396" text-anchor="middle" class="node-label">CI Pipeline</text>
  <text x="550" y="412" text-anchor="middle" class="node-sub">lint → typecheck → test → build</text>
  <text x="550" y="426" text-anchor="middle" class="node-sub">GitHub Actions</text>

  <rect x="660" y="372" width="180" height="76" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="396" text-anchor="middle" class="node-label">Pre-commit Hooks</text>
  <text x="750" y="412" text-anchor="middle" class="node-sub">husky + lint-staged</text>
  <text x="750" y="426" text-anchor="middle" class="node-sub">Local enforcement</text>

  <!-- Layer 4: Entropy Management -->
  <rect x="40" y="480" width="880" height="100" rx="8" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1"/>
  <text x="60" y="502" class="layer-label">LAYER 4: ENTROPY MANAGEMENT</text>

  <rect x="60" y="512" width="200" height="56" rx="6" fill="#ffffff" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="536" text-anchor="middle" class="node-label">GC Runner</text>
  <text x="160" y="552" text-anchor="middle" class="node-sub">npm run gc</text>

  <rect x="280" y="512" width="200" height="56" rx="6" fill="#ffffff" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="536" text-anchor="middle" class="node-label">Weekly Scan</text>
  <text x="380" y="552" text-anchor="middle" class="node-sub">gc.yml cron Monday 9am</text>

  <rect x="500" y="512" width="200" height="56" rx="6" fill="#ffffff" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="536" text-anchor="middle" class="node-label">Entropy Scans</text>
  <text x="600" y="552" text-anchor="middle" class="node-sub">Doc drift + violations</text>

  <rect x="720" y="512" width="140" height="56" rx="6" fill="#ffffff" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="536" text-anchor="middle" class="node-label">Issue Creation</text>
  <text x="790" y="552" text-anchor="middle" class="node-sub">Auto-report</text>

  <!-- Arrows: Layer connections -->
  <line x1="140" y1="168" x2="130" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="320" y1="168" x2="290" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="500" y1="168" x2="450" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <line x1="130" y1="308" x2="150" y2="370" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="290" y1="308" x2="350" y2="370" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <line x1="150" y1="448" x2="160" y2="510" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="350" y1="448" x2="380" y2="510" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="550" y1="448" x2="600" y2="510" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Legend -->
  <rect x="40" y="600" width="880" height="80" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="622" class="layer-label" font-size="12">LEGEND</text>

  <line x1="60" y1="640" x2="100" y2="640" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="110" y="644" class="legend-text">Documentation flow</text>

  <line x1="230" y1="640" x2="270" y2="640" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="280" y="644" class="legend-text">Enforcement flow</text>

  <line x1="400" y1="640" x2="440" y2="640" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="450" y="644" class="legend-text">Automation flow</text>

  <rect x="60" y="652" width="16" height="16" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="86" y="664" class="legend-text">Orientation</text>

  <rect x="180" y="652" width="16" height="16" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="206" y="664" class="legend-text">Documentation</text>

  <rect x="310" y="652" width="16" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="336" y="664" class="legend-text">Enforcement</text>

  <rect x="430" y="652" width="16" height="16" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="456" y="664" class="legend-text">Entropy mgmt</text>

  <!-- Core principle callout -->
  <rect x="560" y="628" width="340" height="44" rx="6" fill="#1e293b" opacity="0.05"/>
  <text x="570" y="648" class="legend-text" font-weight="600" fill="#1e293b">Core: If agents can't see it, it doesn't exist.</text>
  <text x="570" y="664" class="legend-text">All knowledge machine-readable in repo.</text>
</svg>
