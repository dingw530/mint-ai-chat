<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc">
  <title id="title">Mint LLM Wiki 知识摄入与双通道混合查询全链路</title>
  <desc id="desc">展示 Mint LLM Wiki 从资料摄入、LLM 编译、Wiki 事实源落盘，到 FTS5 关键词索引与 Ollama BGE-M3 sqlite-vec 向量索引双通道写入；查询时并行执行 BM25 和向量召回，经 RRF 融合、生命周期过滤、页面去重后返回 LLM 上下文。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="compiler" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="fusion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="writeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="keywordArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="vectorArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="fusionArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/>
    </marker>
    <marker id="fallbackArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .lane-title { font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .lane-note { font: 400 13px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .node-title { font: 700 17px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-title-light { font: 700 17px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .body { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .body-light { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e0e7ff; }
      .mono { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .mono-light { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #dbeafe; }
      .label { font: 600 12px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .small { font: 400 12px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .small-light { font: 400 12px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #cbd5e1; }
      .channel { font: 700 13px Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: .3px; }
    </style>
  </defs>

  <rect width="1920" height="1280" fill="url(#bg)"/>
  <rect x="32" y="28" width="1856" height="1224" rx="26" fill="#ffffff" opacity="0.76"/>

  <text x="70" y="78" class="title">Mint LLM Wiki：知识摄入与双通道混合查询</text>
  <text x="70" y="108" class="subtitle">Markdown 是事实源；FTS5 负责可解释的关键词召回，BGE-M3 + sqlite-vec 提供语义召回，RRF 将两路结果合并</text>

  <!-- Ingest lane -->
  <rect x="64" y="142" width="1792" height="454" rx="20" fill="#f8fafc" stroke="#dbeafe" stroke-width="2"/>
  <rect x="64" y="142" width="1792" height="54" rx="20" fill="#eff6ff"/>
  <text x="92" y="176" class="lane-title">① 知识摄入链路 · 双通道建索引</text>
  <text x="410" y="176" class="lane-note">资料 → 编译 → Wiki 事实源 → 关键词索引 + 语义向量索引</text>

  <g filter="url(#shadow)">
    <rect x="92" y="246" width="222" height="224" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="340" y="246" width="236" height="224" rx="16" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <rect x="602" y="226" width="300" height="264" rx="16" fill="url(#compiler)"/>
    <rect x="928" y="226" width="342" height="264" rx="16" fill="url(#source)"/>
    <rect x="1354" y="204" width="468" height="324" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1378" y="258" width="420" height="104" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="1378" y="394" width="420" height="108" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  </g>

  <!-- Input -->
  <circle cx="130" cy="286" r="20" fill="#e2e8f0"/>
  <path d="M122 286h16M130 278v16" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <text x="162" y="292" class="node-title">资料输入</text>
  <text x="116" y="334" class="body">上传 / URL / Chat</text>
  <text x="116" y="362" class="body">TXT · MD · PDF · HTML</text>
  <text x="116" y="406" class="mono">WikiIngestionJob</text>
  <text x="116" y="434" class="small">校验格式、大小、路径</text>

  <!-- Capture -->
  <circle cx="378" cy="286" r="20" fill="#cffafe"/>
  <path d="M368 282h20v12h-20zM371 278h14v4h-14z" fill="none" stroke="#0e7490" stroke-width="2"/>
  <text x="410" y="292" class="node-title">原始资料归档</text>
  <text x="368" y="334" class="body">sources/</text>
  <text x="368" y="362" class="body">不可变 Source 快照</text>
  <text x="368" y="406" class="mono">hash + sourceType</text>
  <text x="368" y="434" class="small">保留原文，便于追溯</text>

  <!-- Compiler -->
  <circle cx="642" cy="274" r="20" fill="#ddd6fe"/>
  <path d="M632 274c0-6 4-10 10-10s10 4 10 10-4 10-10 10-10-4-10-10zM637 290h10" fill="none" stroke="#4c1d95" stroke-width="2"/>
  <text x="675" y="280" class="node-title-light">LLM Wiki 编译器</text>
  <text x="632" y="326" class="body-light">Schema + 已有页面索引</text>
  <text x="632" y="354" class="body-light">主题拆分 · 分类 · 标签</text>
  <text x="632" y="382" class="body-light">摘要 · Claims · Relationships</text>
  <text x="632" y="426" class="mono-light">compileSource()</text>
  <text x="632" y="454" class="small-light">AI 负责编译，文件负责事实</text>

  <!-- Canonical source -->
  <circle cx="968" cy="274" r="20" fill="#99f6e4"/>
  <path d="M957 271h9l3 4h10v12h-22z" fill="none" stroke="#115e59" stroke-width="2"/>
  <text x="1000" y="280" class="node-title-light">Wiki 事实源</text>
  <text x="956" y="326" class="body-light">pages/分类/页面.md</text>
  <text x="956" y="354" class="body-light">_schema.json · _manifest.json</text>
  <text x="956" y="382" class="body-light">claims · lifecycle · graph</text>
  <text x="956" y="426" class="mono-light">Markdown 可读、索引可重建</text>
  <text x="956" y="454" class="small-light">同一事实源 → 两条派生通道</text>

  <!-- Index container and keyword channel -->
  <text x="1380" y="232" class="node-title">SQLite 派生索引（可重建）</text>
  <text x="1380" y="250" class="small">同一份页面内容，分别进入两条检索通道</text>
  <text x="1398" y="282" class="channel" fill="#1d4ed8">通道 A · 关键词</text>
  <text x="1398" y="308" class="node-title">FTS5 / BM25</text>
  <text x="1398" y="334" class="body">title · heading · body · tags · claims</text>
  <text x="1398" y="350" class="mono">wiki_search_documents_fts</text>

  <!-- Vector channel -->
  <text x="1398" y="418" class="channel" fill="#6d28d9">通道 B · 语义向量</text>
  <text x="1398" y="444" class="node-title">Ollama BGE-M3 → sqlite-vec</text>
  <text x="1398" y="470" class="body">1024 维 · cosine distance · Top-K</text>
  <text x="1398" y="492" class="mono">hash 增量 · model/dimension 失效重建</text>

  <!-- Ingest arrows -->
  <path d="M314 358H340" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="316" y="346" class="label">原文</text>
  <path d="M576 358H602" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#vectorArrow)"/>
  <text x="578" y="346" class="label">source</text>
  <path d="M902 358H928" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#vectorArrow)"/>
  <text x="904" y="346" class="label">compiled</text>
  <path d="M1270 340C1310 340 1320 310 1354 310" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#writeArrow)"/>
  <text x="1280" y="326" class="label">chunks</text>
  <path d="M1270 414C1310 414 1320 448 1354 448" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#writeArrow)"/>
  <text x="1280" y="468" class="label">chunks + metadata</text>

  <!-- Query lane -->
  <rect x="64" y="638" width="1792" height="518" rx="20" fill="#f8fafc" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="64" y="638" width="1792" height="54" rx="20" fill="#eff6ff"/>
  <text x="92" y="672" class="lane-title">② 知识查询链路 · 双通道并行 + RRF 融合</text>
  <text x="500" y="672" class="lane-note">同一个问题同时走 BM25 与向量 Top-K，服务异常时保留 FTS5 结果</text>

  <g filter="url(#shadow)">
    <rect x="92" y="758" width="222" height="194" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="340" y="738" width="288" height="234" rx="16" fill="url(#fusion)"/>
    <rect x="700" y="718" width="390" height="126" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="700" y="888" width="390" height="140" rx="16" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <rect x="1166" y="778" width="286" height="192" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <rect x="1510" y="778" width="310" height="192" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="1166" y="1010" width="654" height="86" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="92" y="1050" width="990" height="76" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6 5"/>
  </g>

  <!-- Query input -->
  <circle cx="130" cy="798" r="20" fill="#e2e8f0"/>
  <path d="M125 793a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM131 804l7 7" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <text x="162" y="804" class="node-title">用户 / Agent</text>
  <text x="116" y="846" class="body">问题：</text>
  <text x="116" y="874" class="body">“如何提升工程能力？”</text>
  <text x="116" y="918" class="mono">wiki_search(question)</text>

  <!-- Search orchestrator -->
  <circle cx="378" cy="778" r="20" fill="#bfdbfe"/>
  <path d="M368 778h20M378 768v20" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="410" y="784" class="node-title-light">searchWiki / wiki_search</text>
  <text x="368" y="828" class="body-light">解析问题 · 初始化索引</text>
  <text x="368" y="856" class="body-light">searchMode: keyword | hybrid</text>
  <text x="368" y="884" class="body-light">当前：hybrid（显式开启）</text>
  <text x="368" y="928" class="mono-light">RRF 统一排序入口</text>

  <!-- Keyword query channel -->
  <text x="724" y="750" class="channel" fill="#1d4ed8">通道 A · 关键词召回</text>
  <text x="724" y="778" class="node-title">FTS5 / BM25 查询</text>
  <text x="724" y="806" class="body">提取关键词 → OR 召回 Top-K chunks</text>
  <text x="724" y="830" class="mono">searchDocuments(question)</text>

  <!-- Vector query channel -->
  <text x="724" y="920" class="channel" fill="#6d28d9">通道 B · 语义召回</text>
  <text x="724" y="948" class="node-title">BGE-M3 查询向量 → sqlite-vec</text>
  <text x="724" y="976" class="body">问题 embedding → cosine Top-K chunks</text>
  <text x="724" y="1004" class="mono">searchVectorDocuments(queryVector)</text>

  <!-- Fusion and output -->
  <circle cx="1200" cy="816" r="20" fill="#cffafe"/>
  <path d="M1190 816h20M1200 806v20" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1232" y="822" class="node-title">RRF 融合排序</text>
  <text x="1190" y="866" class="body">lexical 0.6 · vector 0.4</text>
  <text x="1190" y="894" class="body">rank constant k = 60</text>
  <text x="1190" y="938" class="mono">mergeCandidates()</text>

  <circle cx="1544" cy="816" r="20" fill="#bbf7d0"/>
  <path d="M1535 811h18v12h-18zM1539 807h10" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="1576" y="822" class="node-title">过滤 · 加权 · 页面去重</text>
  <text x="1530" y="866" class="body">lifecycle 状态过滤</text>
  <text x="1530" y="894" class="body">title / heading / tag / claim 加分</text>
  <text x="1530" y="938" class="mono">同一 sourcePath 只返回一次</text>

  <!-- Context output -->
  <text x="1190" y="1044" class="node-title">证据上下文 → LLM / Agent</text>
  <text x="1450" y="1044" class="body">snippet / 完整页面 · citations · access event</text>

  <!-- Direct paths note -->
  <text x="118" y="1078" class="node-title">paths 模式（旁路）</text>
  <text x="118" y="1106" class="body">已知 pages/xxx.md 时，安全读取文件，跳过双通道搜索</text>

  <!-- Query arrows -->
  <path d="M314 854H340" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#keywordArrow)"/>
  <text x="316" y="842" class="label">query</text>
  <path d="M628 808C658 808 670 780 700 780" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#keywordArrow)"/>
  <text x="640" y="766" class="label">关键词</text>
  <path d="M628 904C658 904 670 950 700 950" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#vectorArrow)"/>
  <text x="640" y="958" class="label">向量</text>
  <path d="M1090 780C1120 780 1135 816 1166 816" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#keywordArrow)"/>
  <text x="1094" y="766" class="label">BM25 Top-K</text>
  <path d="M1090 958C1120 958 1135 900 1166 900" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#vectorArrow)"/>
  <text x="1094" y="974" class="label">向量 Top-K</text>
  <path d="M1452 874H1510" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#fusionArrow)"/>
  <text x="1454" y="862" class="label">融合后</text>
  <path d="M1665 970V1010" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#writeArrow)"/>
  <text x="1678" y="994" class="label">证据</text>

  <!-- Explicit fallback path -->
  <path d="M1090 1000C1120 1040 1138 1050 1166 1050" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#fallbackArrow)"/>
  <text x="1030" y="1050" class="label" fill="#b45309">Embedding 失败 → 保留 FTS5</text>

  <!-- Legend -->
  <rect x="70" y="1180" width="1780" height="46" rx="13" fill="#f1f5f9"/>
  <line x1="94" y1="1203" x2="132" y2="1203" stroke="#0f766e" stroke-width="3" marker-end="url(#writeArrow)"/>
  <text x="142" y="1208" class="small">事实源 / 索引写入</text>
  <line x1="290" y1="1203" x2="328" y2="1203" stroke="#2563eb" stroke-width="3" marker-end="url(#keywordArrow)"/>
  <text x="338" y="1208" class="small">FTS5 / BM25</text>
  <line x1="470" y1="1203" x2="508" y2="1203" stroke="#7c3aed" stroke-width="3" marker-end="url(#vectorArrow)"/>
  <text x="518" y="1208" class="small">BGE-M3 / sqlite-vec</text>
  <line x1="700" y1="1203" x2="738" y2="1203" stroke="#0891b2" stroke-width="3" marker-end="url(#fusionArrow)"/>
  <text x="748" y="1208" class="small">RRF 融合 / 返回</text>
  <line x1="900" y1="1203" x2="938" y2="1203" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#fallbackArrow)"/>
  <text x="948" y="1208" class="small">降级 / 旁路</text>
  <text x="1190" y="1208" class="small">核心原则：一份事实源 · 两条检索通道 · 可解释融合 · 失败可降级</text>
</svg>
