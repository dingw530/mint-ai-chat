<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#31537a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#718096"/>
    </marker>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#102a43; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#627d98; }
      .section { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#17324d; }
      .card-title { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#102a43; }
      .card-subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#486581; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#334e68; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#627d98; }
      .inverse { fill:#ffffff; }
      .badge { font: 700 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#ffffff; letter-spacing:1px; }
      .footer { font: 500 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#486581; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <text x="720" y="58" text-anchor="middle" class="title">Mint：AI Agent 前端架构的五个层面</text>
  <text x="720" y="88" text-anchor="middle" class="subtitle">前端不是单纯的 Chat UI，而是 Agent 执行过程的可视化与可干预界面</text>

  <!-- Frontend boundary -->
  <rect x="54" y="125" width="1332" height="505" rx="22" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="78" y="108" width="338" height="38" rx="19" fill="#2f6fed"/>
  <text x="247" y="134" text-anchor="middle" class="badge">前端强相关：交互面 · 运行面 · 控制面</text>
  <text x="1335" y="137" text-anchor="end" class="small">Frontend Core</text>

  <!-- Interaction card -->
  <g filter="url(#shadow)">
    <rect x="90" y="180" width="378" height="375" rx="18" fill="#ffffff" stroke="#75a7ff" stroke-width="2"/>
    <rect x="90" y="180" width="378" height="74" rx="18" fill="#2f6fed"/>
    <rect x="90" y="235" width="378" height="19" fill="#2f6fed"/>
  </g>
  <circle cx="128" cy="217" r="22" fill="#ffffff" fill-opacity="0.2"/>
  <text x="128" y="225" text-anchor="middle" font-size="24" fill="#ffffff">↔</text>
  <text x="166" y="215" class="card-title inverse">交互面</text>
  <text x="166" y="238" class="card-subtitle inverse">用户如何使用和理解 Agent</text>
  <text x="118" y="293" class="body">• 对话输入、文件上传、多模态输入</text>
  <text x="118" y="326" class="body">• 流式输出与消息分片渲染</text>
  <text x="118" y="359" class="body">• 工具调用过程与执行进度</text>
  <text x="118" y="392" class="body">• 暂停、继续、取消、重试</text>
  <text x="118" y="425" class="body">• 审批、错误、引用和 Artifact 展示</text>
  <rect x="118" y="466" width="320" height="58" rx="12" fill="#edf4ff"/>
  <text x="278" y="490" text-anchor="middle" class="small">Mint：Chat · Wiki · Images</text>
  <text x="278" y="512" text-anchor="middle" class="small">前端直接负责的体验层</text>

  <!-- Runtime card -->
  <g filter="url(#shadow)">
    <rect x="531" y="180" width="378" height="375" rx="18" fill="#ffffff" stroke="#75a7ff" stroke-width="2"/>
    <rect x="531" y="180" width="378" height="74" rx="18" fill="#2458c7"/>
    <rect x="531" y="235" width="378" height="19" fill="#2458c7"/>
  </g>
  <circle cx="569" cy="217" r="22" fill="#ffffff" fill-opacity="0.2"/>
  <text x="569" y="225" text-anchor="middle" font-size="22" fill="#ffffff">▶</text>
  <text x="607" y="215" class="card-title inverse">运行面</text>
  <text x="607" y="238" class="card-subtitle inverse">用户如何观察和干预执行</text>
  <text x="559" y="293" class="body">• Run 生命周期与状态机</text>
  <text x="559" y="326" class="body">• SSE / WebSocket 事件消费</text>
  <text x="559" y="359" class="body">• 推理步骤、工具链路和中间结果</text>
  <text x="559" y="392" class="body">• 断线重连、状态恢复、幂等</text>
  <text x="559" y="425" class="body">• 取消、重试、后台任务入口</text>
  <rect x="559" y="466" width="320" height="58" rx="12" fill="#edf4ff"/>
  <text x="719" y="490" text-anchor="middle" class="small">Mint：useSSE · Run Controller</text>
  <text x="719" y="512" text-anchor="middle" class="small">后端执行引擎的前端投影</text>

  <!-- Control card -->
  <g filter="url(#shadow)">
    <rect x="972" y="180" width="378" height="375" rx="18" fill="#ffffff" stroke="#75a7ff" stroke-width="2"/>
    <rect x="972" y="180" width="378" height="74" rx="18" fill="#164194"/>
    <rect x="972" y="235" width="378" height="19" fill="#164194"/>
  </g>
  <circle cx="1010" cy="217" r="22" fill="#ffffff" fill-opacity="0.2"/>
  <text x="1010" y="225" text-anchor="middle" font-size="23" fill="#ffffff">⚙</text>
  <text x="1048" y="215" class="card-title inverse">控制面</text>
  <text x="1048" y="238" class="card-subtitle inverse">用户如何配置 Agent 的行为</text>
  <text x="1000" y="293" class="body">• Agent、模型和 Provider 选择</text>
  <text x="1000" y="326" class="body">• 工具开关、权限和审批策略</text>
  <text x="1000" y="359" class="body">• 上下文范围与记忆策略</text>
  <text x="1000" y="392" class="body">• 自动化程度、预算和超时</text>
  <text x="1000" y="425" class="body">• 配置校验、预览和版本管理</text>
  <rect x="1000" y="466" width="320" height="58" rx="12" fill="#edf4ff"/>
  <text x="1160" y="490" text-anchor="middle" class="small">Mint：Settings · Agents · Tool Policy</text>
  <text x="1160" y="512" text-anchor="middle" class="small">前端配置，后端强制执行</text>

  <!-- arrows within frontend -->
  <path d="M468 365 L525 365" fill="none" stroke="#2f6fed" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="497" y="346" text-anchor="middle" class="small">事件 / 状态</text>
  <path d="M972 365 L915 365" fill="none" stroke="#2f6fed" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="944" y="346" text-anchor="middle" class="small">策略 / 控制</text>
  <path d="M720 555 L720 600" fill="none" stroke="#2f6fed" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="740" y="585" class="small">读写状态</text>

  <!-- Supporting layers -->
  <text x="720" y="676" text-anchor="middle" class="section">支撑层：前端消费，后端主责</text>
  <rect x="90" y="710" width="600" height="164" rx="18" fill="#ffffff" stroke="#9fb3c8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90" y="710" width="600" height="55" rx="18" fill="#52606d"/>
  <rect x="90" y="747" width="600" height="18" fill="#52606d"/>
  <text x="120" y="745" class="card-title inverse">数据面</text>
  <text x="120" y="802" class="body">会话、消息、记忆、Wiki、检索结果、Tool Result、Artifact</text>
  <text x="120" y="833" class="small">前端：状态管理、缓存、展示与同步　｜　后端：持久化、检索与数据一致性</text>

  <rect x="750" y="710" width="600" height="164" rx="18" fill="#ffffff" stroke="#9fb3c8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="750" y="710" width="600" height="55" rx="18" fill="#52606d"/>
  <rect x="750" y="747" width="600" height="18" fill="#52606d"/>
  <text x="780" y="745" class="card-title inverse">治理面</text>
  <text x="780" y="802" class="body">权限、安全、审计、成本、日志、Trace、评测和错误恢复</text>
  <text x="780" y="833" class="small">前端：审批、提示与可观测性　｜　后端：安全策略、审计和强制约束</text>

  <!-- relationship from support -->
  <path d="M390 630 L390 700" fill="none" stroke="#718096" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <path d="M1050 630 L1050 700" fill="none" stroke="#718096" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>

  <!-- legend and takeaway -->
  <rect x="90" y="900" width="1260" height="38" rx="19" fill="#dbeafe"/>
  <circle cx="116" cy="919" r="7" fill="#2f6fed"/>
  <text x="132" y="925" class="footer">蓝色区域 = 前端强相关</text>
  <line x1="350" y1="919" x2="390" y2="919" stroke="#718096" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="405" y="925" class="footer">灰色虚线 = 前后端协作边界</text>
  <text x="1325" y="925" text-anchor="end" class="footer">核心：可视化 + 可控制 + 可恢复</text>
</svg>
