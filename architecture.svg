<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Mint Architecture</title>
  <desc id="desc">Mint 当前架构：React 客户端通过 IPC 优先、HTTP 回退访问声明式端点；服务层包含对话 Agent 与知识库摄入、图谱候选审核流水线。</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="violet" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 30px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.sub{font:400 15px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#526075}.lane{font:700 16px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#334155}.nt{font:700 17px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.st{font:400 13px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#526075}.mini{font:400 12px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#526075}.edge{font:600 12px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#41516a}.box{stroke-width:1.5}.code{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#526075}
    </style>
  </defs>
  <rect width="1800" height="1320" fill="#f8fafc"/>
  <rect x="36" y="26" width="1728" height="86" rx="8" fill="#fff" stroke="#d7e0ec"/>
  <text x="70" y="65" class="title">Mint · 清言 - 当前架构</text>
  <text x="70" y="93" class="sub">Electron 使用 IPC 优先、HTTP 回退；浏览器直接使用 Express API。知识库摄入与图谱审核沿独立流水线落盘。</text>

  <!-- Presentation -->
  <rect x="36" y="138" width="1728" height="188" rx="8" fill="#f5f9ff" stroke="#c9dafc"/>
  <text x="60" y="170" class="lane">客户端 · React 18 / Vite</text>
  <rect x="88" y="195" width="480" height="96" rx="7" fill="#fff" stroke="#90b4f8" class="box"/>
  <text x="328" y="224" text-anchor="middle" class="nt">功能模块</text>
  <text x="328" y="250" text-anchor="middle" class="st">Chat · Images · Settings · Wiki</text>
  <text x="328" y="273" text-anchor="middle" class="st">Wiki Graph · Candidate Review</text>
  <rect x="660" y="195" width="480" height="96" rx="7" fill="#edf4ff" stroke="#5f8fe8" class="box"/>
  <text x="900" y="224" text-anchor="middle" class="nt">共享交互与 API 客户端</text>
  <text x="900" y="250" text-anchor="middle" class="st">useSSE · services/api · endpoint manifest</text>
  <text x="900" y="273" text-anchor="middle" class="code">callEndpoint() / ipcOrHttp()</text>
  <rect x="1232" y="195" width="480" height="96" rx="7" fill="#fff7e7" stroke="#d99524" class="box"/>
  <text x="1472" y="224" text-anchor="middle" class="nt">知识图谱界面</text>
  <text x="1472" y="250" text-anchor="middle" class="st">节点/关系统计 · 可视化 · 关系详情</text>
  <text x="1472" y="273" text-anchor="middle" class="st">候选审核：采纳 / 拒绝</text>
  <path d="M568 243 H660" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <path d="M1140 243 H1232" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>

  <!-- Transport -->
  <rect x="36" y="350" width="1728" height="180" rx="8" fill="#fff" stroke="#d7e0ec"/>
  <text x="60" y="382" class="lane">传输与端点路由</text>
  <rect x="105" y="404" width="390" height="80" rx="7" fill="#f4ecff" stroke="#9b6cf3" class="box"/>
  <text x="300" y="435" text-anchor="middle" class="nt">Electron IPC（优先）</text>
  <text x="300" y="460" text-anchor="middle" class="st">contextBridge → ipcRenderer.invoke</text>
  <rect x="690" y="392" width="430" height="104" rx="7" fill="#f4ecff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="905" y="423" text-anchor="middle" class="nt">Electron Main Process</text>
  <text x="905" y="449" text-anchor="middle" class="st">preload.js 暴露 ElectronAPI</text>
  <text x="905" y="472" text-anchor="middle" class="st">main.js 注册 ipcMain handlers</text>
  <rect x="1315" y="404" width="390" height="80" rx="7" fill="#f5f9ff" stroke="#90b4f8" class="box"/>
  <text x="1510" y="435" text-anchor="middle" class="nt">HTTP（浏览器 / 回退）</text>
  <text x="1510" y="460" text-anchor="middle" class="st">Vite proxy → Express :3001</text>
  <path d="M495 444 H690" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#violet)"/>
  <path d="M1120 444 H1315" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gray)"/>
  <text x="594" y="429" text-anchor="middle" class="edge">IPC 主通道</text>
  <text x="1218" y="429" text-anchor="middle" class="edge">故障回退</text>

  <!-- Server -->
  <rect x="36" y="554" width="1728" height="412" rx="8" fill="#fff" stroke="#d7e0ec"/>
  <text x="60" y="586" class="lane">服务端 · Express 4 / TypeScript</text>
  <rect x="80" y="622" width="340" height="292" rx="7" fill="#f5f9ff" stroke="#5f8fe8" class="box"/>
  <text x="250" y="654" text-anchor="middle" class="nt">声明式端点层</text>
  <text x="250" y="680" text-anchor="middle" class="st">endpoints/definitions</text>
  <rect x="105" y="706" width="290" height="46" rx="5" fill="#e1edff"/><text x="250" y="735" text-anchor="middle" class="st">Express 路由自动生成</text>
  <rect x="105" y="768" width="290" height="46" rx="5" fill="#eee4ff"/><text x="250" y="797" text-anchor="middle" class="st">IPC handler 自动注册</text>
  <rect x="105" y="830" width="290" height="46" rx="5" fill="#e8f7ee"/><text x="250" y="859" text-anchor="middle" class="st">端点清单同步给前端</text>

  <rect x="490" y="622" width="540" height="292" rx="7" fill="#edf4ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="760" y="654" text-anchor="middle" class="nt">对话与 Agent 核心</text>
  <rect x="522" y="686" width="224" height="72" rx="5" fill="#dbeafe"/><text x="634" y="716" text-anchor="middle" class="nt">AI Proxy</text><text x="634" y="741" text-anchor="middle" class="st">streamChat / SSE</text>
  <rect x="774" y="686" width="224" height="72" rx="5" fill="#dbeafe"/><text x="886" y="716" text-anchor="middle" class="nt">ReAct Loop</text><text x="886" y="741" text-anchor="middle" class="st">reactLoopCore</text>
  <rect x="522" y="786" width="224" height="72" rx="5" fill="#dbeafe"/><text x="634" y="816" text-anchor="middle" class="nt">Adapters</text><text x="634" y="841" text-anchor="middle" class="st">OpenAI / Anthropic</text>
  <rect x="774" y="786" width="224" height="72" rx="5" fill="#dbeafe"/><text x="886" y="816" text-anchor="middle" class="nt">Tools</text><text x="886" y="841" text-anchor="middle" class="st">Bash / Wiki / Weather</text>

  <rect x="1100" y="622" width="610" height="292" rx="7" fill="#f0fdf4" stroke="#4ca66a" stroke-width="1.8"/>
  <text x="1405" y="654" text-anchor="middle" class="nt">业务服务与知识库流水线</text>
  <rect x="1130" y="686" width="255" height="72" rx="5" fill="#dcfce7"/><text x="1257" y="716" text-anchor="middle" class="nt">API Services</text><text x="1257" y="741" text-anchor="middle" class="st">conversation / settings / memory</text>
  <rect x="1420" y="686" width="255" height="72" rx="5" fill="#dcfce7"/><text x="1547" y="716" text-anchor="middle" class="nt">Wiki 摄入</text><text x="1547" y="741" text-anchor="middle" class="st">归档 → AI 编译 → 页面</text>
  <rect x="1130" y="786" width="255" height="72" rx="5" fill="#dcfce7"/><text x="1257" y="816" text-anchor="middle" class="nt">图谱构建</text><text x="1257" y="841" text-anchor="middle" class="st">主语义边裁决 / references</text>
  <rect x="1420" y="786" width="255" height="72" rx="5" fill="#fff7e7"/><text x="1547" y="816" text-anchor="middle" class="nt">跨批次候选</text><text x="1547" y="841" text-anchor="middle" class="st">本地筛选 → LLM 审查 → 人工确认</text>
  <path d="M420 768 H490" stroke="#2563eb" stroke-width="2.6" marker-end="url(#blue)"/>
  <path d="M1030 768 H1100" stroke="#2563eb" stroke-width="2.6" marker-end="url(#blue)"/>

  <!-- Storage and external -->
  <rect x="36" y="990" width="1728" height="236" rx="8" fill="#fff" stroke="#d7e0ec"/>
  <text x="60" y="1022" class="lane">持久化与外部依赖</text>
  <path d="M1257 858 V1045" stroke="#15803d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#green)"/>
  <path d="M1547 758 V900 H1547 V1045" stroke="#d97706" stroke-width="2.5" marker-end="url(#orange)"/>
  <rect x="105" y="1058" width="420" height="112" rx="7" fill="#f0fdf4" stroke="#4ca66a" class="box"/>
  <ellipse cx="146" cy="1086" rx="18" ry="7" fill="none" stroke="#15803d" stroke-width="2"/><path d="M128 1086 v35 c0 9 36 9 36 0 v-35 M128 1103 c0 9 36 9 36 0" fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="326" y="1090" text-anchor="middle" class="nt">SQLite · better-sqlite3</text>
  <text x="326" y="1118" text-anchor="middle" class="st">conversations · messages · settings</text>
  <text x="326" y="1142" text-anchor="middle" class="st">graph_nodes · graph_edges · graph_edge_candidates</text>
  <rect x="690" y="1058" width="420" height="112" rx="7" fill="#f5f9ff" stroke="#5f8fe8" class="box"/>
  <path d="M725 1080 h38 l10 10 v41 h-48 z M763 1080 v10 h10" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="900" y="1090" text-anchor="middle" class="nt">Wiki 文件系统</text>
  <text x="900" y="1118" text-anchor="middle" class="st">sources/ · pages/ · _schema.json</text>
  <text x="900" y="1142" text-anchor="middle" class="st">_index.md · _manifest.json</text>
  <rect x="1275" y="1058" width="420" height="112" rx="7" fill="#fff7e7" stroke="#d99524" class="box"/>
  <path d="M1312 1094 h47 M1335 1071 v47" stroke="#d97706" stroke-width="2"/>
  <text x="1485" y="1090" text-anchor="middle" class="nt">外部服务</text>
  <text x="1485" y="1118" text-anchor="middle" class="st">OpenAI / Anthropic / QWeather</text>
  <text x="1485" y="1142" text-anchor="middle" class="st">MCP Servers</text>
  <path d="M1257 858 V1008 H326 V1058" stroke="#15803d" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#green)"/>
  <path d="M1547 758 V994 H900 V1058" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/>
  <path d="M886 858 V1008 H1485 V1058" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#orange)"/>
  <text x="508" y="995" class="edge">图谱正式数据</text><text x="1094" y="981" class="edge">页面与来源资料</text><text x="1175" y="995" class="edge">模型与工具调用</text>

  <!-- Legend -->
  <rect x="36" y="1250" width="1728" height="48" rx="8" fill="#fff" stroke="#d7e0ec"/>
  <text x="60" y="1280" class="lane">图例</text>
  <path d="M145 1276 h52" stroke="#2563eb" stroke-width="2.6" marker-end="url(#blue)"/><text x="212" y="1281" class="mini">主调用 / 数据流</text>
  <path d="M380 1276 h52" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#violet)"/><text x="447" y="1281" class="mini">Electron IPC</text>
  <path d="M588 1276 h52" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gray)"/><text x="655" y="1281" class="mini">HTTP 回退</text>
  <path d="M806 1276 h52" stroke="#15803d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#green)"/><text x="873" y="1281" class="mini">SQLite 持久化</text>
  <path d="M1045 1276 h52" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#orange)"/><text x="1112" y="1281" class="mini">模型 / 外部服务</text>
  <text x="1380" y="1281" class="mini">审核通过的候选关系才写入 graph_edges。</text>
</svg>
