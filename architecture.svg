<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-prim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-ipc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <filter id="shadow-lg" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="780" fill="#f8fafc"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Mint · 清言 — Architecture</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">IPC Primary / HTTP Fallback</text>

  <!-- ==================== CLIENT LAYER ==================== -->
  <rect x="30" y="70" width="940" height="180" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="45" y="90" font-size="12" font-weight="600" fill="#64748b">CLIENT</text>

  <!-- Renderer Process -->
  <rect x="55" y="105" width="380" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="55" y="105" width="380" height="28" rx="8" fill="#f1f5f9"/>
  <circle cx="72" cy="119" r="5" fill="#ef4444"/><circle cx="84" cy="119" r="5" fill="#f59e0b"/><circle cx="96" cy="119" r="5" fill="#22c55e"/>
  <text x="245" y="123" text-anchor="middle" font-size="11" fill="#64748b">Renderer Process (React SPA)</text>
  <rect x="70" y="160" width="85" height="26" rx="5" fill="#e0e7ff"/><text x="112" y="177" text-anchor="middle" font-size="11" fill="#4338ca">Sidebar</text>
  <rect x="165" y="160" width="85" height="26" rx="5" fill="#e0e7ff"/><text x="207" y="177" text-anchor="middle" font-size="11" fill="#4338ca">ChatArea</text>
  <rect x="260" y="160" width="85" height="26" rx="5" fill="#e0e7ff"/><text x="302" y="177" text-anchor="middle" font-size="11" fill="#4338ca">Settings</text>
  <text x="70" y="210" font-size="10" fill="#64748b">Hooks: useSSE.ts  |  API: services/api/*.ts</text>

  <!-- Electron Main Process -->
  <rect x="560" y="105" width="260" height="130" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow-lg)"/>
  <rect x="560" y="105" width="260" height="28" rx="8" fill="#f3e8ff"/>
  <text x="690" y="123" text-anchor="middle" font-size="11" font-weight="600" fill="#6b21a8">Electron Main Process</text>
  <rect x="580" y="145" width="220" height="24" rx="5" fill="#f3e8ff"/><text x="690" y="161" text-anchor="middle" font-size="11" fill="#7c3aed">preload.js (contextBridge)</text>
  <rect x="580" y="175" width="220" height="24" rx="5" fill="#f3e8ff"/><text x="690" y="191" text-anchor="middle" font-size="11" fill="#7c3aed">main.js (ipcMain.handle)</text>
  <text x="575" y="222" font-size="10" fill="#64748b">window.electronAPI → ipcRenderer.invoke</text>

  <!-- IPC Bridge between processes -->
  <rect x="440" y="145" width="115" height="28" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="497" y="163" text-anchor="middle" font-size="11" font-weight="500" fill="#6b21a8">IPC Bridge</text>
  <line x1="435" y1="159" x2="556" y2="159" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-ipc)"/>
  <line x1="556" y1="150" x2="440" y2="150" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-ipc)"/>

  <!-- ==================== SERVER LAYER ==================== -->
  <rect x="30" y="295" width="940" height="235" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="45" y="315" font-size="12" font-weight="600" fill="#64748b">SERVER — Express 4 (port 3001)</text>

  <!-- Entry + Routes -->
  <rect x="55" y="335" width="190" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="55" y="335" width="190" height="24" rx="8" fill="#e0f2fe"/>
  <text x="150" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">入口 · 路由</text>
  <text x="70" y="380" font-size="11" fill="#1e293b">index.ts → app.ts</text>
  <text x="70" y="400" font-size="10" fill="#64748b">conversations · messages</text>

  <!-- Core Engine -->
  <rect x="270" y="335" width="370" height="180" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow-lg)"/>
  <rect x="270" y="335" width="370" height="28" rx="8" fill="#dbeafe"/>
  <text x="455" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Core Engine (In-Process)</text>

  <rect x="285" y="375" width="160" height="52" rx="6" fill="#dbeafe"/>
  <text x="365" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">aiProxy.ts</text>
  <text x="365" y="412" text-anchor="middle" font-size="10" fill="#3b82f6">streamChat · generateTitle</text>

  <rect x="460" y="375" width="165" height="52" rx="6" fill="#dbeafe"/>
  <text x="542" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">reactLoopCore.ts</text>
  <text x="542" y="412" text-anchor="middle" font-size="10" fill="#3b82f6">ReAct 多轮循环</text>

  <rect x="285" y="440" width="160" height="28" rx="5" fill="#dbeafe"/>
  <text x="365" y="458" text-anchor="middle" font-size="11" fill="#1d4ed8">toolRoundEngine</text>
  <rect x="460" y="440" width="165" height="28" rx="5" fill="#dbeafe"/>
  <text x="542" y="458" text-anchor="middle" font-size="11" fill="#1d4ed8">toolRegistry</text>

  <!-- Services -->
  <rect x="670" y="335" width="285" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="335" width="285" height="28" rx="8" fill="#f0fdf4"/>
  <text x="812" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Services</text>

  <rect x="685" y="375" width="125" height="42" rx="5" fill="#dcfce7"/>
  <text x="747" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Adapters</text>
  <text x="692" y="408" font-size="10" fill="#166534">OpenAI · Anthropic</text>
  <rect x="820" y="375" width="120" height="42" rx="5" fill="#fef3c7"/>
  <text x="880" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Tools</text>
  <text x="827" y="408" font-size="10" fill="#92400e">Bash · Weather</text>

  <rect x="685" y="428" width="255" height="74" rx="5" fill="#fef2f2"/>
  <text x="812" y="444" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">API Services (services/api/)</text>
  <text x="695" y="462" font-size="10" fill="#64748b">conversation · settings · agent</text>
  <text x="695" y="478" font-size="10" fill="#64748b">memory · endpoint · mcp</text>
  <text x="695" y="494" font-size="10" fill="#64748b">skill · image · routing · qweather</text>

  <!-- ==================== Arrows Client → Server ==================== -->
  <!-- IPC: Main Process → Server (straight down, centered at 690) -->
  <path d="M 690 235 L 690 290" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow-ipc)"/>
  <rect x="624" y="250" width="132" height="20" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="690" y="263" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">IPC 主通道</text>

  <!-- HTTP: Renderer → Server (dashed, goes to Entry+Routes) -->
  <path d="M 245 235 L 245 290 Q 245 310 150 310 L 150 330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-sec)"/>
  <rect x="175" y="252" width="140" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="245" y="264" text-anchor="middle" font-size="10" fill="#94a3b8">HTTP 备胎 (vite proxy)</text>

  <!-- ==================== Arrows Server Internal ==================== -->
  <!-- Route → Core Engine -->
  <path d="M 245 375 L 265 375" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-sec)"/>
  <!-- Core Engine → Services -->
  <path d="M 640 400 L 665 400" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-sec)"/>

  <!-- ==================== DATA & EXTERNAL LAYER ==================== -->
  <rect x="30" y="545" width="940" height="120" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="45" y="565" font-size="12" font-weight="600" fill="#64748b">DATA &amp; EXTERNAL</text>

  <!-- SQLite -->
  <rect x="55" y="580" width="240" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="175" y="600" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">SQLite (better-sqlite3)</text>
  <text x="68" y="620" font-size="10" fill="#64748b">conversations · messages · settings</text>

  <!-- External APIs -->
  <rect x="340" y="580" width="200" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="600" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">External APIs</text>
  <text x="353" y="620" font-size="10" fill="#64748b">AI API · QWeather · MCP</text>

  <!-- ==================== Arrows to Data Layer ==================== -->
  <!-- API Services → SQLite -->
  <path d="M 780 515 L 780 545 L 175 545 L 175 575" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-sec)"/>
  <!-- Core Engine → External APIs -->
  <path d="M 455 515 L 455 545 L 440 545 L 440 575" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-prim)"/>

  <!-- ==================== LEGEND ==================== -->
  <rect x="600" y="585" width="150" height="90" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="610" y="603" font-size="11" font-weight="600" fill="#1e293b">Legend</text>
  <line x1="610" y1="620" x2="640" y2="620" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-ipc)"/>
  <text x="650" y="624" font-size="10" fill="#6b21a8">IPC (primary)</text>
  <line x1="610" y1="640" x2="640" y2="640" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-sec)"/>
  <text x="650" y="644" font-size="10" fill="#94a3b8">HTTP (fallback)</text>
  <line x1="610" y1="660" x2="640" y2="660" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-prim)"/>
  <text x="650" y="664" font-size="10" fill="#059669">External API</text>

  <!-- ==================== STRATEGY NOTE ==================== -->
  <rect x="55" y="665" width="420" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="65" y="685" font-size="11" font-weight="500" fill="#1e293b">调用策略: ipcOrHttp(ipcCall, httpCall)</text>
  <text x="65" y="703" font-size="10" fill="#64748b">Electron → IPC (ipcRenderer.invoke → ipcMain.handle → service)</text>
  <text x="65" y="716" font-size="10" fill="#64748b">Browser  → HTTP (fetch → Express route → service)</text>

</svg>